<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panjat Pinang IPS Kelas VII - Berkenalan Dengan Alam</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka & Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&
    family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.
    css">
    
    <style>
        * {
            font-family: 'Fredoka', 'Nunito', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Gradient Background Biru-Hijau Lembut */
        body {
            background: linear-gradient(135deg, #0ea5e9 0%, #14b8a6 40%, #10b981 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(0, 90, 110, 0.18);
        }
        /* Button Press Animation */
        .btn-bounce {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 0px rgba(0, 0, 0, 0.15);
        }
